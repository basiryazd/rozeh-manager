name: Basir Yazd volunteer form delivery setup — one-time synthetic probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/basir-volunteer-form-activation-test.yml'
permissions:
  contents: read
jobs:
  synthetic-first-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Trigger FormSubmit email-owner activation with ONLY dummy test data
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          import urllib.parse
          import urllib.error
          endpoint="https://formsubmit.co/basiryazd@gmail.com"
          values={
            "نام_و_نام_خانوادگی":"آزمون راه‌اندازی خودکار بصیر یزد - اطلاعات غیرواقعی",
            "راه_تماس":"example@example.invalid",
            "شهر_یا_شهرستان":"آزمون",
            "زمینه_همکاری[]":"آزمون اتصال",
            "زمان_همکاری":"فعلاً نامشخص",
            "توضیحات_تکمیلی":"این پیام فقط برای تأیید دریافت ایمیل فرم است. داوطلب واقعی نیست.",
            "رضایت_برای_ارتباط":"آزمون سامانه",
            "_subject":"آزمون راه‌اندازی فرم همکاری بصیر یزد",
            "_template":"table",
            "_next":"https://basiryazd.github.io/rozeh-manager/basir-social/site/volunteer-thanks.html",
            "_url":"https://basiryazd.github.io/rozeh-manager/basir-social/site/volunteer.html"
          }
          payload=urllib.parse.urlencode(values).encode("utf-8")
          req=urllib.request.Request(endpoint,data=payload,headers={
            "Content-Type":"application/x-www-form-urlencoded",
            "Referer":"https://basiryazd.github.io/rozeh-manager/basir-social/site/volunteer.html",
            "User-Agent":"Mozilla/5.0 (compatible; BasirYazdVolunteerSetup/1.0)"})
          try:
            with urllib.request.urlopen(req,timeout=23) as response:
              print("FORM_TEST_PROVIDER_HTTP_STATUS",response.status)
              print("FORM_TEST_PROVIDER_FINAL_HOST",urllib.parse.urlsplit(response.url).hostname)
              print("FORM_TEST_FOLLOWUP_EMAIL_CONFIRMATION_REQUIRED_FOR_FIRST_ACTIVATION")
          except urllib.error.HTTPError as exc:
            print("FORM_TEST_PROVIDER_HTTP_ERROR",exc.code)
            print("FORM_TEST_PROVIDER_FINAL_HOST",urllib.parse.urlsplit(exc.url).hostname)
          except urllib.error.URLError as exc:
            print("FORM_TEST_PROVIDER_UNREACHABLE",type(exc.reason).__name__)
          PY
