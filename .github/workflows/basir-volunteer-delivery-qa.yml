name: Basir volunteer form delivery and privacy QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/basir-volunteer-delivery-qa.yml'
      - 'basir-social/site/volunteer.html'
      - 'basir-social/site/volunteer-delivery-config.json'
permissions:
  contents: read
jobs:
  form:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Chromium test driver
        run: python -m pip install 'playwright>=1.54,<2'
      - name: Verify client-side validation and safe private fallback
        run: |
          python3 -m http.server 8897 --bind 127.0.0.1 >/tmp/basir-volunteer-testserver.log 2>&1 &
          python3 - <<'PY'
          import shutil
          from playwright.sync_api import sync_playwright
          from urllib.parse import unquote
          url="http://127.0.0.1:8897/basir-social/site/volunteer.html"
          with sync_playwright() as p:
              executable=shutil.which("google-chrome") or shutil.which("chromium") or shutil.which("google-chrome-stable")
              if not executable:
                  raise RuntimeError("No chromium found: cannot claim browser QA")
              browser=p.chromium.launch(executable_path=executable,headless=True,
                args=["--no-sandbox","--disable-dev-shm-usage"])
              for label,size in (("desktop",{"width":1280,"height":900}),("mobile",{"width":390,"height":844})):
                  ctx=browser.new_context(viewport=size)
                  page=ctx.new_page()
                  external=[]
                  page.on("request",lambda req:external.append(req.url) if "formsubmit.co" in req.url or "formspree.io" in req.url else None)
                  resp=page.goto(url,wait_until="networkidle",timeout=30000)
                  assert resp.status==200
                  assert page.locator("#volunteerForm").get_attribute("action")=="#"
                  assert page.locator("#deliveryNotice").inner_text().find("ایمیل")>=0
                  assert page.locator("#interestOptions input[type=checkbox]").count()>=8
                  page.locator("#name").fill("داوطلب آزمون غیرواقعی")
                  page.locator("#contact").fill("test@example.invalid")
                  page.locator("#city").fill("یزد")
                  page.locator("#interestOptions input[type=checkbox]").first.check()
                  page.locator('input[name="زمان_همکاری"]').first.check()
                  page.locator('input[name="رضایت_برای_ارتباط"]').check()
                  page.locator("#submitButton").click()
                  link=page.locator("#emailFallback")
                  assert link.is_visible()
                  href=unquote(link.get_attribute("href"))
                  assert href.startswith("mailto:basiryazd@gmail.com?")
                  assert "test@example.invalid" in href and "داوطلب آزمون غیرواقعی" in href
                  assert page.locator("#copyFallback").is_visible()
                  assert page.url==url
                  assert not external,external
                  print("VOLUNTEER_FORM_SAFE_FALLBACK",label,"PASS",flush=True)
                  ctx.close()
              browser.close()
          PY
      - name: Confirm no private details were stored in git or sent off-site
        run: |
          ! grep -qi 'formsubmit.co' basir-social/site/volunteer.html
          grep -q 'volunteer-delivery-config.json' basir-social/site/volunteer.html
          echo 'Form fallback tested. Automatic submission remains disabled until a verified and owner-authorized Formspree endpoint is configured.' >> "$GITHUB_STEP_SUMMARY"
