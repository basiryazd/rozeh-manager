name: Basir legacy social visuals — manual PRIVATE archive only

# Legacy geometric template has been rejected by the owner. It may be regenerated
# solely for offline quality comparisons, never auto published or pushed to the
# public asset directory. All new designs require a separate verified pipeline.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-legacy-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer
        run: python -m pip install "Pillow==11.3.0"
      - name: Produce historical comparison assets only
        run: |
          python basir-social/generate_media.py --days 2
          python - <<'PY'
          from pathlib import Path
          p=Path("basir-social/public_media/manifest.json")
          assert p.exists()
          print("LEGACY_PRIVATE_PREVIEW_ONLY: no publishing, no public push.")
          PY
      - name: Attach brief-lived review artifacts, not public website assets
        uses: actions/upload-artifact@v4
        with:
          name: old-design-rejected-private-reference
          path: |
            basir-social/public_media/manifest.json
            basir-social/public_media/story-*.jpg
            basir-social/public_media/feed-*.jpg
          retention-days: 2
          if-no-files-found: error
